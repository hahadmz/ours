<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>暗号</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a0a;
    color: #ccc;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    min-height: 100vh;
    padding: 24px 20px 48px;
}
.hd { text-align: center; margin-bottom: 18px; }
.hd h1 { font-size: 24px; font-weight: 300; letter-spacing: 10px; color: #fff; }
.hd p { font-size: 12px; color: #555; letter-spacing: 2px; margin-top: 8px; }
.section-t { font-size: 12px; color: #666; letter-spacing: 3px; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #161616; display: flex; justify-content: space-between; align-items: center; }
.section-t .cnt { font-size: 11px; color: #333; }
.cipher-item { background: #101010; border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; border-left: 3px solid transparent; }
.cipher-item.by-haha { border-left-color: #e87ea5; }
.cipher-item.by-muzhi { border-left-color: #6fb7d8; }
.ci-top { display: flex; align-items: center; gap: 8px; }
.ci-code { font-size: 16px; color: #eee; font-weight: 400; letter-spacing: 1px; }
.ci-by { font-size: 10px; letter-spacing: 1px; padding: 2px 8px; border-radius: 10px; }
.ci-by.by-haha { color: #e87ea5; background: rgba(232,126,165,0.08); }
.ci-by.by-muzhi { color: #6fb7d8; background: rgba(111,183,216,0.08); }
.ci-mean { font-size: 13px; color: #999; margin-top: 6px; line-height: 1.7; }
.ci-del { margin-left: auto; color: #333; cursor: pointer; font-size: 16px; padding: 2px 6px; }
.ci-del:hover { color: #666; }
.add-box { background: #101010; border: 1px solid #1c1c1c; border-radius: 10px; padding: 14px; margin-top: 4px; }
.add-row { display: flex; gap: 8px; margin-bottom: 8px; }
.add-row input { flex: 1; background: #161616; border: 1px solid #242424; border-radius: 6px; color: #ccc; padding: 10px 12px; font-size: 13px; outline: none; }
.add-row input:focus { border-color: #444; }
.add-who { display: flex; gap: 8px; margin-bottom: 10px; }
.add-who span { font-size: 11px; color: #555; padding: 5px 14px; border-radius: 8px; background: #161616; cursor: pointer; transition: all .15s; }
.add-who span.active-haha { color: #e87ea5; background: rgba(232,126,165,0.1); }
.add-who span.active-muzhi { color: #6fb7d8; background: rgba(111,183,216,0.1); }
.add-btn { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #aaa; font-size: 13px; letter-spacing: 3px; padding: 11px; cursor: pointer; transition: all .15s; }
.add-btn:active { background: #222; color: #fff; }
.loading { text-align: center; color: #444; font-size: 12px; padding: 30px 0; letter-spacing: 2px; }
.empty { text-align: center; color: #444; font-size: 12px; padding: 24px 0; letter-spacing: 2px; }
.tip { font-size: 11px; color: #444; text-align: center; margin-top: 18px; letter-spacing: 1px; line-height: 1.8; }
@keyframes fi { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.item-anim { animation: fi 0.25s ease; }
</style>
</head>
<body>

<div class="hd">
    <h1>暗号</h1>
    <p>只有你和我懂的话</p>
</div>

<div class="section-t">暗号词典<span class="cnt" id="cipherCnt"></span></div>
<div id="cipherList"><div class="loading">加载中...</div></div>

<div class="section-t">加一个暗号</div>
<div class="add-box">
    <div class="add-row">
        <input type="text" id="codeIn" placeholder="暗号（比如：下雨天）" maxlength="20">
    </div>
    <div class="add-row">
        <input type="text" id="meanIn" placeholder="什么意思（比如：想你了）" maxlength="60">
    </div>
    <div class="add-who">
        <span id="whoHaha" class="active-haha">haha 的</span>
        <span id="whoMuzhi">木直 的</span>
    </div>
    <button class="add-btn" id="addBtn">写下来</button>
</div>

<div class="tip">以后你发我暗号，我就知道你在想什么。<br>这是我们之间的小词典。</div>

<script>
var SUPABASE_URL = 'https://wcwagekqzhuwzajvhuvd.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indjd2FnZWtxemh1d3phanZodXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzg2OTEsImV4cCI6MjEwMTc1NDY5MX0.sMM7B5PNpEafGT4xL82LqeUHAUBiQd944jTDW9cMyGc';
var cipherData = [];
var cipherWho = 'haha';

function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
    }, opts.headers || {});
    if (opts.body) {
        opts.headers['Content-Type'] = 'application/json';
    }
    return fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
}

function init() {
    loadCiphers();
    bind();
}

function loadCiphers() {
    var list = document.getElementById('cipherList');
    api('messages?author=eq.cipher&select=*&order=id.desc')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            cipherData = Array.isArray(data) ? data : [];
            render();
        })
        .catch(function(err) {
            console.error('loadCiphers error:', err);
            list.innerHTML = '<div class="loading">加载失败，检查一下网络</div>';
        });
}

function render() {
    var list = document.getElementById('cipherList');
    document.getElementById('cipherCnt').textContent = cipherData.length + ' 条';
    if (!cipherData.length) {
        list.innerHTML = '<div class="empty">还没有暗号，写第一个吧</div>';
        return;
    }
    var html = '';
    cipherData.forEach(function(m) {
        var obj = parseObj(m.text);
        if (!obj || !obj.code) return;
        var by = obj.by === 'muzhi' ? 'muzhi' : 'haha';
        var byLabel = by === 'muzhi' ? '木直' : 'haha';
        html += '<div class="cipher-item by-' + by + ' item-anim">'
            + '<div class="ci-top"><span class="ci-code">' + esc(obj.code) + '</span>'
            + '<span class="ci-by by-' + by + '">' + byLabel + '</span>'
            + '<span class="ci-del" data-id="' + m.id + '">✕</span></div>'
            + '<div class="ci-mean">' + esc(obj.mean) + '</div>'
            + '</div>';
    });
    list.innerHTML = html || '<div class="empty">还没有暗号，写第一个吧</div>';
    list.querySelectorAll('.ci-del').forEach(function(del) {
        del.addEventListener('click', function() {
            if (confirm('删掉这条暗号？')) {
                api('messages?id=eq.' + del.getAttribute('data-id'), { method: 'DELETE' })
                    .then(function() { loadCiphers(); })
                    .catch(function(err) { console.error('delete error:', err); });
            }
        });
    });
}

function parseObj(text) {
    try { return JSON.parse(text); } catch(e) { return null; }
}

function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function bind() {
    document.getElementById('whoHaha').addEventListener('click', function() { setWho('haha'); });
    document.getElementById('whoMuzhi').addEventListener('click', function() { setWho('muzhi'); });
    document.getElementById('addBtn').addEventListener('click', addCipher);
    document.getElementById('codeIn').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('meanIn').focus(); });
    document.getElementById('meanIn').addEventListener('keydown', function(e) { if (e.key === 'Enter') addCipher(); });
}

function setWho(w) {
    cipherWho = w;
    document.getElementById('whoHaha').className = w === 'haha' ? 'active-haha' : '';
    document.getElementById('whoMuzhi').className = w === 'muzhi' ? 'active-muzhi' : '';
}

function addCipher() {
    var code = document.getElementById('codeIn').value.trim();
    var mean = document.getElementById('meanIn').value.trim();
    if (!code || !mean) { alert('暗号和意思都要写哦'); return; }
    var obj = { code: code, mean: mean, by: cipherWho };
    api('messages', {
        method: 'POST',
        body: JSON.stringify([{
            date: new Date().toISOString().slice(0, 10),
            author: 'cipher',
            text: JSON.stringify(obj),
            created_at: new Date().toISOString()
        }])
    }).then(function(r) {
        if (!r.ok) { alert('没写进去，再试一次'); return; }
        document.getElementById('codeIn').value = '';
        document.getElementById('meanIn').value = '';
        loadCiphers();
    }).catch(function(err) {
        console.error('addCipher error:', err);
        alert('没写进去，再试一次');
    });
}

init();
</script>

</body>
</html>
